services:
  svc-db:
    image: postgres:18-bookworm
    container_name: svc-db
    environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
    volumes:
        - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
    
  svc-db-port:
    image: alpine/socat:1.8.0.3
    container_name: svc-db-port
    command: "tcp-listen:5432,fork,reuseaddr tcp-connect:svc-db:5432"
    ports:
    - "127.0.0.1:5432:5432"
  
  svc-db-migrate:
    image: migrate/migrate:v4.19.1
    volumes: 
        - ${PROJECT_ROOT}/migrations:/migrations
